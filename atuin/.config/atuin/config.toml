# Atuin configuration (local, no sync)
auto_sync = false
# atuin 18.x renamed this. Bare `keymap` is now a table of cursor styles, so
# the old `keymap = "emacs"` fails to deserialize and atuin refuses to start.
keymap_mode = "emacs"
style = "auto"
show_preview = true
inline_height = 18
filter_mode = "global"      # search across all history
search_mode = "fuzzy"       # fuzzy matching for Ctrl-R

# Uncomment to tweak further:
# # number of results to return
# max_results = 1000
# # prefer_builtin_history = false
