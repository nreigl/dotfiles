# Mise configuration for universal version management
# Python is now managed by UV, not mise

[tools]
node = "22"         # Node.js v22 LTS
ruby = "latest"     # Latest stable Ruby
go = "latest"
rust = "stable"     # Stable Rust toolchain
bun = "latest"

[settings]
experimental = true
# Read idiomatic version files (.nvmrc and .node-version, .ruby-version,
# .go-version) for these tools. It replaces the deprecated legacy_version_file.
# The default list is empty, and then mise reads no idiomatic file.
idiomatic_version_file_enable_tools = ["node", "ruby", "go"]
always_keep_download = false
jobs = 4
