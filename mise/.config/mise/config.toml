# Mise configuration for universal version management
# Python is now managed by UV, not mise

[tools]
node = "22"         # Node.js v22 LTS
ruby = "latest"     # Latest stable Ruby
go = "latest"
rust = "stable"     # Stable Rust toolchain
bun = "latest"

[settings]
experimental = true
# Read idiomatic version files (.nvmrc and .node-version, .ruby-version) for
# these tools. It replaces the deprecated legacy_version_file. The default list
# is empty, and then mise reads no idiomatic file.
# Go is not in the list. For go, mise also reads the `go` directive in go.mod,
# which is only a minimum version: in every Go project it pinned an old Go and
# printed a deprecation warning (removed in mise 2026.11.0). Pin Go per project
# in mise.toml instead.
idiomatic_version_file_enable_tools = ["node", "ruby"]
always_keep_download = false
jobs = 4
