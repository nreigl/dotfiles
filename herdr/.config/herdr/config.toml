# herdr configuration
# Mirrors tmux conventions from ~/dotfiles/tmux/.tmux.conf
# Reload with: herdr server reload-config
#   NOTE: [keys] changes need a full restart (herdr server stop; herdr) —
#   reload-config applies UI settings only, stale bindings linger otherwise.
# Validate with: herdr config check

# First-run onboarding already done
onboarding = false

[theme]
# Match tmux/nvim Catppuccin setup; follow terminal light/dark appearance
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
# Inherit the source pane's working directory (tmux: new-window -c "#{pane_current_path}")
new_cwd = "follow"

[update]
channel = "stable"

[keys]
# Same prefix as tmux (set -g prefix C-a).
# NOTE: if you ever run herdr *inside* tmux, tmux swallows ctrl+a first —
# switch this back to "ctrl+b" in that case.
prefix = "ctrl+a"

# Splits like tmux | and -
# herdr's split_vertical stacks DOWN, split_horizontal goes RIGHT.
# v = side-by-side (tmux |), minus = stacked (tmux -). Not backslash: on this
# layout \ is Option-composed and reaches herdr as an alt-chord escape.
split_horizontal = "prefix+v"
split_vertical = "prefix+minus"

# Vim-style pane navigation (herdr defaults already match tmux prefix+hjkl)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# New tab on prefix+c (matches tmux bind c), indexed switching on prefix+1..9
new_tab = "prefix+c"
switch_tab = "prefix+1..9"

# Direct Alt+1..9 tab switching without prefix (tmux: bind -n M-1..5)
[keys.indexed]
tabs = "alt"

# lazygit popup (analog of the tmux floax floating pane)
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

# --- Plugins ---

# vim-herdr-navigation: Ctrl+hjkl moves across herdr panes AND nvim splits
# (nvim side loaded via nvim/lua/plugins/herdr-nav.lua; falls back to wincmd
# outside herdr). NOTE: shadows readline Ctrl+L clear / Ctrl+K kill-line in
# shell panes — same tradeoff as vim-tmux-navigator.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# sessionizer: fuzzy project picker (tmux-sessionizer style) + worktree picker
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sessionizer.open"
description = "fuzzy-open project workspace"

[[keys.command]]
# NOT prefix+shift+w — that's the built-in rename_workspace
key = "prefix+shift+f"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "fuzzy-open git worktree workspace"

# file-viewer: git-aware read-only tree + diff/markdown/code pane
# NOT prefix+e — that's the built-in edit_scrollback
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "file viewer (split)"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "file viewer (tab)"

# termscope: jump list from visible pane text — open files (nvim, file:line
# preserved) or URLs an agent just mentioned. Television-based picker.
[[keys.command]]
key = "ctrl+shift+a"
type = "plugin_action"
command = "termscope.open"
description = "visible-screen file picker"

[[keys.command]]
# NOT ctrl+e (readline end-of-line); u for URL
key = "prefix+u"
type = "plugin_action"
command = "termscope.open-links"
description = "visible-screen link picker"

[worktrees]
# Root for herdr-created git worktrees (prefix+shift+G), kept next to projects in ~/dev
directory = "~/dev/worktrees"

[ui]
# Show Claude panes with live activity (terminal title) in the sidebar
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

# In-app toasts when a background agent finishes or needs attention
[ui.toast]
delivery = "herdr"
delay_seconds = 1

# Sounds when agents in background workspaces finish or need attention
[ui.sound]
enabled = true

[ui.sound.agents]
claude = "on"

[session]
# Resume agent conversations after a server restart
# (analog of tmux-resurrect/continuum)
resume_agents_on_restore = true

[experimental]
# Inline image rendering; needs a Kitty-graphics-capable outer terminal
# (Ghostty: solid support; WezTerm: partial)
kitty_graphics = true
