# tuios: terminal multiplexer and window manager. https://tuios.dev/
#
# Write only the keys that differ from the defaults. tuios watches this file
# and applies a save at once. `tuios list-options` prints every key with its
# default. That command needs a running daemon: `tuios start-server`.
#
# The settings page (leader then ',') and `tuios set-config` write into this
# file. Only the stowed config.toml is in the repo. themes/ and config.d/
# stay as real files in ~/.config/tuios/.

[appearance]
# Same theme pair as Ghostty: theme = dark:Ayu Mirage,light:Ayu Light
theme = "ayu_mirage"
theme_light = "ayu_light"

# tuios wrote these two on first run: tiling on, and sessions kept by the
# background daemon across detach.
[startup]
tiled = true
daemon = true

# Same leader and keys as tmux (set -g prefix C-a) and herdr (prefix =
# "ctrl+a"). tuios keeps Ctrl+A from the pane, so zsh loses start-of-line.
# Press Ctrl+A twice to send it to the pane.
# Do not run tuios inside herdr or tmux: the outer one takes Ctrl+A first,
# and tuios never gets its leader. herdr also takes Alt+1..9 (tab switch)
# before tuios sees it (workspace switch).
[keybindings]
leader_key = "ctrl+a"
preset = "tmux"

# Austrian layout: | is Option+7, \ is Option+Shift+7, [ is Option+5, and
# ] is Option+6. After the leader, Ghostty sends these as "alt+7 with the
# text |". tuios 0.12.1 drops the text and looks up only alt+7, so Ctrl+A |
# did nothing. The alt+N keys below bind the chords to the same actions.
# Upstream fixed this after 0.12.1 (commit d6cd422, discussion #850). Remove
# the alt+N keys when `tuios --version` is newer than 0.12.1.
# Ctrl+A % splits left and right with no Option key at all.
[keybindings.prefix_mode]
prefix_split_vertical = ["%", "|", "\\", "alt+7", "alt+shift+7"]
prefix_selection = ["[", "alt+5"]
paste_buffer = ["]", "alt+6"]
