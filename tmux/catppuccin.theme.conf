# Catppuccin theme configuration (catppuccin/tmux v2)
# The plugin is declared in .tmux.conf. v2 does not build the status line from
# a module list: status-right must name each module after the plugin loads.

set -g @catppuccin_flavor "mocha"

# Windows: rounded pills, name first, number on the right
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status modules: colored icon, separate pills
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{pane_current_path}"

# Load the plugin now, so the @catppuccin_status_* modules exist.
# TPM runs it again later. That run does not change the options above.
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
