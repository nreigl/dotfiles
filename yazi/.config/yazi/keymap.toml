# Keep this file MINIMAL, for the same reason as yazi.toml: yazi merges it over
# its built-in presets. `prepend_keymap` adds to the defaults instead of
# replacing them, so every stock binding still works.
#
# Defaults already on the `g` prefix: g h (~), g c (~/.config),
# g d (~/Downloads), g <Space> (type a path), g f (follow symlink), g g (top).
#
# For directories you visit by recency rather than by name, use Z (zoxide)
# instead of adding a binding here. Z shares the database with the `zz` shell
# function, so it is already populated.

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = "cd ~/Documents/research"
desc = "Go research"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/Documents/notes"
desc = "Go notes (ZenNotes vault)"

[[mgr.prepend_keymap]]
on   = [ "g", "R" ]
run  = "cd ~/Documents/r_projects"
desc = "Go r_projects"

[[mgr.prepend_keymap]]
on   = [ "g", "." ]
run  = "cd ~/dotfiles"
desc = "Go dotfiles"
